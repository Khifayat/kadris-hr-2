# Deprecated for new UAT deployments: prefer ECS/Fargate because App Runner is closed to new customers after April 30, 2026.
version: 1.0
runtime: nodejs22
build:
  commands:
    pre-build:
      - corepack enable
      - corepack prepare pnpm@11.19.0 --activate
    build:
      - pnpm install --frozen-lockfile
      - pnpm run deploy:build
run:
  runtime-version: 22
  command: pnpm start
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: production
    - name: DEV_AUTH_BYPASS
      value: "false"
