services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kadris_hr
      POSTGRES_USER: kadris
      POSTGRES_PASSWORD: kadris_dev_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadris -d kadris_hr"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - kadris_postgres_data:/var/lib/postgresql/data

volumes:
  kadris_postgres_data:
